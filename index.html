<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>İş Analizi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">İş Analizi</p>
                <h1>Görüşmeler</h1>
            </div>
            <a class="button primary" href="form.html">Yeni Görüşme</a>
        </header>

        <main class="content">
            <section class="summary-grid" aria-label="Özet">
                <article class="metric">
                    <span class="metric-label">Toplam Görüşme</span>
                    <strong id="totalCount">0</strong>
                </article>
                <article class="metric">
                    <span class="metric-label">Taslak</span>
                    <strong id="draftCount">0</strong>
                </article>
                <article class="metric">
                    <span class="metric-label">Tamamlanan</span>
                    <strong id="doneCount">0</strong>
                </article>
            </section>

            <section class="toolbar" aria-label="Görüşme araçları">
                <input id="searchInput" class="input" type="search" placeholder="Ad, pozisyon veya departman ara">
                <select id="statusFilter" class="input">
                    <option value="tum">Tüm durumlar</option>
                    <option value="taslak">Taslak</option>
                    <option value="tamamlandi">Tamamlandı</option>
                </select>
                <button id="exportButton" class="button secondary" type="button">JSON Kaydet</button>
                <button id="wordAllButton" class="button secondary" type="button">Word'e Aktar</button>
                <label class="button secondary file-button">
                    İçe Aktar
                    <input id="importInput" type="file" accept="application/json,.json">
                </label>
                <button id="sampleButton" class="button ghost" type="button">Örnek Veri</button>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>Kayıtlar</h2>
                </div>
                <div id="emptyState" class="empty-state hidden">
                    Henüz görüşme kaydı yok.
                </div>
                <div id="analysisList" class="analysis-list"></div>
            </section>
        </main>
    </div>

    <div id="printRoot"></div>

    <script src="js/vendor/pizzip.min.js"></script>
    <script src="js/vendor/docxtemplater.js"></script>
    <script src="js/vendor/FileSaver.min.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/word-export.js"></script>
    <script src="js/print.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
