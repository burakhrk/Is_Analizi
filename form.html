<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>İş Analizi Formu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">İş Analizi</p>
                <h1 id="pageTitle">Yeni Görüşme</h1>
            </div>
            <div class="topbar-islemler">
                <button class="button ghost small asistan-ayar-ac" type="button" id="asistanAyarBtnTop" title="Asistan ayarları">⚙️</button>
                <a class="button secondary" href="index.html">Kayıtlara Dön</a>
            </div>
        </header>

        <main class="content form-layout">
            <aside class="section-nav" aria-label="Form bölümleri">
                <div class="progress-wrap" aria-label="Form ilerlemesi">
                    <div class="progress-bar"><div id="progressFill"></div></div>
                    <span id="progressText">0/0 soru</span>
                    <span id="kayitDurumu" class="save-state"></span>
                </div>
                <div id="sectionNav"></div>
                <div class="asistan-kart" id="asistanKart">
                    <strong>✨ Asistan</strong>
                    <span id="asistanDurum" class="asistan-durum">Anahtar girilmedi</span>
                    <button class="button secondary small asistan-ayar-ac" type="button" id="asistanAyarBtn">Asistan Ayarları</button>
                </div>
            </aside>

            <form id="analysisForm" class="form-panel">
                <section class="panel">
                    <div class="panel-header">
                        <h2>Form Bilgisi</h2>
                    </div>
                    <div class="form-grid">
                        <label class="field">
                            <span>Form Doldurulma Tarihi</span>
                            <input class="input" name="form_tarihi" type="date" required>
                        </label>
                    </div>
                </section>

                <div id="questionSections"></div>

                <div class="form-actions">
                    <button class="button ghost" type="button" id="jsonExportButton">JSON Kaydet</button>
                    <button class="button ghost" type="button" id="pdfExportButton">PDF Kaydet</button>
                    <button class="button ghost" type="button" id="wordExportButton">Word'e Aktar</button>
                    <button class="button secondary" type="button" id="saveDraftButton">Taslak Kaydet</button>
                    <button class="button primary" type="submit">Tamamla ve Kaydet</button>
                </div>
            </form>
        </main>
    </div>

    <div id="printRoot"></div>

    <div id="llmAyarModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="llmAyarBaslik">
        <div class="modal-kutu">
            <h2 id="llmAyarBaslik">Asistan Ayarları (BYOK)</h2>
            <p class="modal-aciklama">Anahtarınız yalnızca bu tarayıcıda (<code>localStorage</code>) saklanır, repoya yazılmaz. İstekler tarayıcıdan doğrudan seçtiğiniz sağlayıcıya gider.</p>
            <label class="field">
                <span>Sağlayıcı</span>
                <select class="input" id="llmSaglayici">
                    <option value="openrouter">OpenRouter (önerilen)</option>
                    <option value="openai">OpenAI</option>
                    <option value="gemini">Gemini</option>
                    <option value="anthropic">Anthropic</option>
                </select>
            </label>
            <label class="field">
                <span>Model</span>
                <select class="input" id="llmModel"></select>
            </label>
            <label class="field">
                <span>API Anahtarı</span>
                <input class="input" id="llmAnahtar" type="password" autocomplete="off" placeholder="sk-... / sk-or-...">
            </label>
            <label class="check-item">
                <input type="checkbox" id="llmAnonim" checked>
                <span>İsimleri maskele ([KİŞİ-1] gibi gönder)</span>
            </label>
            <label class="field">
                <span>Günlük istek limiti</span>
                <input class="input" id="llmLimit" type="number" min="1" max="200" value="50">
            </label>
            <div id="llmAyarMesaj" class="modal-mesaj"></div>
            <div class="modal-islemler">
                <button class="button ghost small" type="button" id="llmTestBtn">Bağlantıyı Test Et</button>
                <button class="button danger small" type="button" id="llmTemizleBtn">Anahtarı Sil</button>
                <button class="button secondary small" type="button" id="llmKapatBtn">Kapat</button>
                <button class="button primary small" type="button" id="llmKaydetBtn">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="js/vendor/pizzip.min.js"></script>
    <script src="js/vendor/docxtemplater.js"></script>
    <script src="js/vendor/FileSaver.min.js"></script>
    <script src="js/questions.js?v=2"></script>
    <script src="js/storage.js?v=2"></script>
    <script src="js/word-export.js?v=2"></script>
    <script src="js/print.js?v=2"></script>
    <script src="js/form.js?v=2"></script>
    <script src="js/llm-client.js?v=1"></script>
    <script src="js/assistant.js?v=1"></script>
</body>
</html>
