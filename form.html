<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>İş Analizi Formu</title>
    <link rel="stylesheet" href="css/style.css?v=10">
    <link rel="stylesheet" href="css/flatpickr.min.css?v=4">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-baslik">
                <p class="eyebrow">İş Analizi</p>
                <h1 id="pageTitle">Yeni Görüşme</h1>
                <!-- form="analysisForm": alan üst barda durur ama formun parçasıdır (form.elements.form_tarihi) -->
                <label class="form-tarihi-alani">
                    <span>Form tarihi</span>
                    <input class="input" name="form_tarihi" type="date" form="analysisForm" required>
                </label>
            </div>
            <div class="topbar-islemler">
                <div class="gecmis-grup" role="group" aria-label="Geçmiş">
                    <button class="button ghost small" type="button" id="geriAlBtn" title="Geri alınacak işlem yok" disabled><span aria-hidden="true">↶</span><span class="buton-yazi">Geri Al</span></button>
                    <button class="button ghost small" type="button" id="ileriAlBtn" title="İleri alınacak işlem yok" disabled><span aria-hidden="true">↷</span><span class="buton-yazi">Yinele</span></button>
                </div>
                <details class="aktar-menu" id="aktarMenu">
                    <summary class="button ghost small">Dışa Aktar ▾</summary>
                    <div class="aktar-menu-liste" role="menu">
                        <button type="button" role="menuitem" id="wordExportButton">Word (.docx)</button>
                        <button type="button" role="menuitem" id="pdfExportButton">PDF / Yazdır</button>
                        <button type="button" role="menuitem" id="jsonExportButton" title="Kaydedip JSON yedeği olarak indir">JSON yedeği</button>
                    </div>
                </details>
                <button class="button primary small" type="button" id="hizliKaydetBtn" title="O ana kadar yapılan değişiklikleri hemen kaydet (otomatik kayıt da açık)">💾 Kaydet</button>
                <a class="button secondary small" href="index.html">Kayıtlara Dön</a>
            </div>
        </header>

        <main class="content form-layout">
            <aside class="section-nav" aria-label="Form bölümleri">
                <button type="button" id="navKatlaBtn" class="nav-katla" aria-expanded="true" title="Sol barı topla">«</button>
                <div class="progress-wrap" aria-label="Form ilerlemesi">
                    <div class="progress-bar"><div id="progressFill"></div></div>
                    <span id="progressText">0/0 soru</span>
                    <span id="kayitDurumu" class="save-state"></span>
                </div>
                <div id="sectionNav"></div>
            </aside>

            <form id="analysisForm" class="form-panel">
                <div id="questionSections"></div>

                <div class="form-actions">
                    <button class="button secondary" type="button" id="saveDraftButton" hidden title="Tamamlanmış kaydı yeniden taslak yapar">Taslağa Çevir</button>
                    <button class="button primary" type="submit">Tamamla ve Kaydet</button>
                </div>
            </form>
        </main>
    </div>

    <div id="printRoot"></div>

    <datalist id="siklikOnerileri">
        <option value="Günlük"></option>
        <option value="Haftalık"></option>
        <option value="Aylık"></option>
        <option value="Yıllık"></option>
        <option value="X"></option>
    </datalist>


    <script src="js/vendor/pizzip.min.js"></script>
    <script src="js/vendor/docxtemplater.js"></script>
    <script src="js/vendor/FileSaver.min.js"></script>
    <script src="js/vendor/flatpickr.min.js"></script>
    <script src="js/vendor/flatpickr.tr.js"></script>
    <script src="js/questions.js?v=4"></script>
    <script src="js/storage.js?v=5"></script>
    <script src="js/word-export.js?v=4"></script>
    <script src="js/print.js?v=4"></script>
    <script src="js/form.js?v=11"></script>
    <script src="js/gecmis.js?v=1"></script>
    <script>
        // Türkçe takvim: görünen alan GG.AA.YYYY, saklanan değer ISO (mevcut mantık değişmez)
        // Baştaki form tarihi + sondaki imza tarihi ikisi de takvimden seçilir.
        if (window.flatpickr) {
            flatpickr.localize(flatpickr.l10ns.tr);
            flatpickr('input[name="form_tarihi"], input[name="cevap_imza_tarih"]', {
                locale: "tr",
                dateFormat: "Y-m-d",
                altInput: true,
                altFormat: "d.m.Y",
                disableMobile: true,
                allowInput: true
            });
        }
    </script>
</body>
</html>
